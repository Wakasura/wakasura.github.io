<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes séries</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e7c86">
<style>
:root{--bg:#f4f6f8;--fg:#1b2430;--mu:#5d6b7a;--card:#fff;--ac:#0e7c86;--bd:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#121a22;--fg:#e8eef4;--mu:#8fa0b1;--card:#1a242e;--ac:#4fd1c5;--bd:#2a3744}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:auto;padding:12px}
h2{font-size:20px;margin:18px 0 10px}
.c{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;align-items:center}
.c img,.ph{width:46px;height:69px;border-radius:6px;object-fit:cover;background:var(--bd);flex:none}
.t{flex:1;min-width:0}.t b{display:block}.m{color:var(--mu);font-size:14px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:9px 14px;background:var(--card);color:var(--fg)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
input[type=search],input#key{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:15px 2px;font-size:14px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 12px;margin-bottom:8px}
summary{padding:10px 0;cursor:pointer}
.ep{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}
.ep input{width:22px;height:22px;flex:none}
.fut{opacity:.55}
.bar{height:6px;border-radius:3px;background:var(--bd);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ep button{padding:5px 9px;font-size:13px;flex:none}.lb{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.er{color:#c0392b}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ch button{padding:6px 12px;font-size:14px;border-radius:99px}.ch button.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){err='Stockage impossible'}};
let D=LS('data')||{shows:{}},C=LS('cache')||{},K=LS('key')||'';
let tab='todo',open=null,os=null,res=[],q='',busy='',err='',ty='all',st='all',so='recent';
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(s,e)=>`S${pad(s)}E${pad(e)}`;
const fd=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const img=p=>p?`<img src="https://image.tmdb.org/t/p/w92${p}" alt="">`:'<div class="ph"></div>';
const api=async(p,x={})=>{const u=new URL('https://api.themoviedb.org/3'+p);const o={};
 u.search=new URLSearchParams({language:'fr-FR',...x});
 if(K.length>40)o.headers={Authorization:'Bearer '+K};else u.searchParams.set('api_key',K);
 const r=await fetch(u,o);if(!r.ok)throw new Error(r.status==401?'Clé API invalide':'Erreur TMDB '+r.status);return r.json()};
async function refresh(id,force){const c=C[id];if(!force&&c&&D.shows[id]?.kind&&Date.now()-c.t<432e5)return;
 const d=await api('/tv/'+id),eps=[];
 await Promise.all(d.seasons.filter(s=>s.season_number>0).map(async s=>{const r=await api(`/tv/${id}/season/${s.season_number}`);
  r.episodes.forEach(e=>eps.push([s.season_number,e.episode_number,e.name||'',e.air_date||'']))}));
 eps.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);C[id]={t:Date.now(),eps};
 if(D.shows[id]){D.shows[id].name=d.name;D.shows[id].poster=d.poster_path;D.shows[id].kind=d.original_language=='ja'&&(d.genres||[]).some(g=>g.id==16)?'anime':'serie'}
 save('cache',C);save('data',D)}
async function refreshAll(force){if(!K)return;busy='Mise à jour des dates…';err='';render();
 for(const id of Object.keys(D.shows)){try{await refresh(id,force)}catch(e){err=e.message}}
 busy='';render()}
const prog=id=>{const T=today(),s=D.shows[id],a=(C[id]?.eps||[]).filter(x=>x[3]&&x[3]<=T),v=a.filter(x=>s.seen[x[0]+'-'+x[1]]).length;return[v,a.length,a.length?Math.round(v/a.length*100):0]};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const TY=[['all','Tout'],['serie','Séries'],['anime','Animes']];
const vis=id=>ty=='all'||(D.shows[id].kind||'serie')==ty;
const chips=(k,o,cur)=>`<div class="ch">`+o.map(([v,l])=>`<button data-f="${k}|${v}" class="${cur==v?'on':''}">${l}</button>`).join('')+'</div>';
function vTodo(){const T=today();let n=0;
 const h=Object.keys(D.shows).filter(id=>vis(id)&&!D.shows[id].dropped).map(id=>{const s=D.shows[id],c=C[id];if(!c)return'';
  const un=c.eps.filter(x=>x[3]&&x[3]<=T&&!s.seen[x[0]+'-'+x[1]]);if(!un.length)return'';n++;const e=un[0];
  return `<div class="c" data-open="${id}">${img(s.poster)}<div class="t"><b>${esc(s.name)}</b><span class="m">${fmt(e[0],e[1])} ${esc(e[2])}</span>${un.length>1?`<br><span class="m">${un.length-1} autre(s) à rattraper</span>`:''}</div><button class="p" data-seen="${id}|${e[0]}|${e[1]}">Vu</button></div>`}).join('');
 return '<h2>À regarder</h2>'+chips('ty',TY,ty)+(n?h:Object.keys(D.shows).length?'<p class="m">Tu es à jour.</p>':'<p class="m">Aucune série suivie. Va dans Ajouter pour en choisir.</p>')}
function vCal(){const T=today();let L=[];
 for(const id in D.shows){if(!vis(id)||D.shows[id].dropped)continue;(C[id]?.eps||[]).forEach(x=>{if(x[3]>=T)L.push([x[3],id,x])})}
 L.sort((a,b)=>a[0].localeCompare(b[0])||a[1]-b[1]);
 const diff=d=>Math.round((new Date(d+'T12:00')-new Date(T+'T12:00'))/864e5);
 return '<h2>Prochaines sorties</h2>'+chips('ty',TY,ty)+(L.slice(0,60).map(([d,id,x])=>{const n=diff(d);
  return `<div class="c" data-open="${id}">${img(D.shows[id].poster)}<div class="t"><b>${esc(D.shows[id].name)}</b><span class="m">${fmt(x[0],x[1])} ${esc(x[2])}</span></div><span class="m">${n==0?"Aujourd'hui":n==1?'Demain':fd(d)}</span></div>`}).join('')||'<p class="m">Aucune sortie annoncée pour tes séries.</p>')}
function vList(){
 let L=Object.keys(D.shows).filter(vis).map(id=>({id,s:D.shows[id],pr:prog(id)}));
 const F={all:()=>1,run:x=>!x.s.dropped&&x.pr[0]>0&&x.pr[0]<x.pr[1],new:x=>!x.s.dropped&&x.pr[0]==0,done:x=>!x.s.dropped&&x.pr[1]>0&&x.pr[0]==x.pr[1],drop:x=>x.s.dropped};
 L=L.filter(F[st]);
 L.sort(so=='title'?(a,b)=>a.s.name.localeCompare(b.s.name,'fr'):so=='prog'?(a,b)=>b.pr[2]-a.pr[2]:(a,b)=>(b.s.added||0)-(a.s.added||0));
 return '<h2>Mes séries</h2>'+chips('ty',TY,ty)+chips('st',[['all','Toutes'],['run','En cours'],['new','Pas commencées'],['done','Complètes'],['drop','Abandonnées']],st)+chips('so',[['recent','Ajout récent'],['title','A à Z'],['prog','Progression']],so)+
  (L.map(({id,s,pr:[v,n,p]})=>`<div class="c" data-open="${id}">${img(s.poster)}<div class="t"><b>${esc(s.name)}</b><span class="m">${v} sur ${n} épisodes vus (${p} %)</span>${s.dropped?'<br><span class="m">Abandonnée</span>':''}${bar(p)}</div></div>`).join('')||'<p class="m">Aucune série ici.</p>')}
function vDetail(id){const s=D.shows[id],T=today(),eps=C[id]?.eps||[],by={};
 eps.forEach(x=>(by[x[0]]??=[]).push(x));
 if(os==null){const f=eps.find(x=>x[3]&&x[3]<=T&&!s.seen[x[0]+'-'+x[1]]);os=f?f[0]:+Object.keys(by).pop()}
 let h=`<button data-back>Retour</button><h2>${esc(s.name)}</h2>${(()=>{const[v,n,p]=prog(id);return `<p class="m">${v} sur ${n} épisodes vus (${p} %)</p>${bar(p)}<br>`})()}`;
 for(const n in by)h+=`<details${n==os?' open':''}><summary><b>Saison ${n}</b></summary><p><button data-all="${id}|${n}">Tout marquer comme vu</button></p>`+
  by[n].map(x=>{const k=x[0]+'-'+x[1],ok=x[3]&&x[3]<=T;return `<div class="ep${ok?'':' fut'}"><label class="lb"><input type="checkbox" data-ep="${id}|${x[0]}|${x[1]}"${s.seen[k]?' checked':''}><span class="t">${x[1]}. ${esc(x[2])}<br><span class="m">${x[3]?fd(x[3]):'Date inconnue'}</span></span></label>${ok?`<button data-upto="${id}|${x[0]}|${x[1]}">Vu jusqu'ici</button>`:''}</div>`}).join('')+'</details>';
 return h+`<p><button data-drop="${id}">${s.dropped?'Reprendre le suivi':'Drop (abandonner)'}</button> <button data-kind="${id}">Classer comme ${s.kind=='anime'?'série':'anime'}</button></p><p><button data-del="${id}">Ne plus suivre</button></p>`}
function vAdd(){return `<h2>Ajouter une série</h2><input type="search" id="q" placeholder="Titre, puis Entrée" value="${esc(q)}"><div style="margin-top:12px">`+
 res.map(r=>`<div class="c">${img(r.poster_path)}<div class="t"><b>${esc(r.name)}</b><span class="m">${(r.first_air_date||'').slice(0,4)}</span></div>${D.shows[r.id]?'<span class="m">Suivie</span>':`<button class="p" data-add="${r.id}">Suivre</button>`}</div>`).join('')+'</div>'}
function vSet(){return `<h2>Clé API TMDB</h2><p class="m">Crée un compte gratuit sur themoviedb.org, puis Paramètres, API. Colle ici la clé (v3) ou le jeton.</p><input id="key" value="${esc(K)}" placeholder="Clé API"><p><button class="p" data-savekey>Enregistrer</button></p>
<h2>Sauvegarde</h2><p class="m">Dernier export : ${esc(LS('lastexp')||'jamais')}</p><p><button data-exp>Exporter</button> <button data-imp>Importer</button></p><input type="file" id="f" accept=".json" hidden>
<h2>Données</h2><p><button data-refresh>Actualiser les dates de sortie</button></p>
<h2>À propos</h2><p class="m">Ce produit utilise l'API TMDB mais n'est ni approuvé ni certifié par <a href="https://www.themoviedb.org" style="color:var(--ac)">TMDB</a>.</p>`}
function render(){const y=window.scrollY;
 const body=open?vDetail(open):!K&&tab!='set'?'<h2>Bienvenue</h2><p>Ajoute ta clé TMDB dans Réglages pour commencer.</p>':{todo:vTodo,cal:vCal,list:vList,add:vAdd,set:vSet}[tab]();
 $('#app').innerHTML=(err?`<p class="er">${esc(err)}</p>`:'')+(busy?`<p class="m">${busy}</p>`:'')+body+'<p class="m" style="margin-top:28px;font-size:12px">Données et images fournies par TMDB.</p>';
 $('#nav').innerHTML=[['todo','À voir'],['cal','Sorties'],['list','Séries'],['add','Ajouter'],['set','Réglages']].map(([k,l])=>`<button data-tab="${k}" class="${tab==k&&!open?'on':''}">${l}</button>`).join('');
 window.scrollTo(0,y)}
document.addEventListener('click',async ev=>{
 const t=ev.target.closest('[data-tab],[data-seen],[data-open],[data-back],[data-ep],[data-all],[data-upto],[data-f],[data-drop],[data-kind],[data-add],[data-del],[data-savekey],[data-exp],[data-imp],[data-refresh]');if(!t)return;const d=t.dataset;
 if('tab'in d){tab=d.tab;open=null;err=''}
 else if('seen'in d){ev.stopPropagation();const[i,s,e]=d.seen.split('|');D.shows[i].seen[s+'-'+e]=1;save('data',D)}
 else if('open'in d){open=d.open;os=null;window.scrollTo(0,0)}
 else if('back'in d)open=null;
 else if('ep'in d){const[i,s,e]=d.ep.split('|');os=+s;if(t.checked)D.shows[i].seen[s+'-'+e]=1;else delete D.shows[i].seen[s+'-'+e];save('data',D)}
 else if('all'in d){const[i,n]=d.all.split('|'),T=today();os=+n;C[i].eps.filter(x=>x[0]==n&&x[3]&&x[3]<=T).forEach(x=>D.shows[i].seen[n+'-'+x[1]]=1);save('data',D)}
 else if('upto'in d){const[i,a,b]=d.upto.split('|').map(Number),T=today();os=a;C[i].eps.forEach(x=>{if(x[3]&&x[3]<=T&&(x[0]<a||x[0]==a&&x[1]<=b))D.shows[i].seen[x[0]+'-'+x[1]]=1});save('data',D)}
 else if('f'in d){const[k,v]=d.f.split('|');if(k=='ty')ty=v;else if(k=='st')st=v;else so=v}
 else if('drop'in d){const x=D.shows[d.drop];x.dropped=!x.dropped;save('data',D)}
 else if('kind'in d){const x=D.shows[d.kind];x.kind=x.kind=='anime'?'serie':'anime';save('data',D)}
 else if('add'in d){const r=res.find(x=>x.id==d.add);D.shows[d.add]={name:r.name,poster:r.poster_path,seen:{},added:Date.now()};save('data',D);busy='Chargement des épisodes…';render();
  try{await refresh(d.add,true)}catch(e){err=e.message}busy=''}
 else if('del'in d){if(!confirm('Ne plus suivre cette série ?'))return;delete D.shows[d.del];delete C[d.del];save('data',D);save('cache',C);open=null}
 else if('savekey'in d){K=$('#key').value.trim();save('key',K);tab='todo';render();return refreshAll(true)}
 else if('exp'in d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,shows:D.shows})],{type:'application/json'}));a.download='series-'+today()+'.json';a.click();save('lastexp',today())}
 else if('imp'in d)return $('#f').click();
 else if('refresh'in d)return refreshAll(true);
 render()});
document.addEventListener('keydown',async e=>{if(e.key!='Enter'||e.target.id!='q')return;q=e.target.value;err='';
 if(!K)err='Ajoute d’abord ta clé TMDB dans Réglages.';else try{res=(await api('/search/tv',{query:q})).results.slice(0,15)}catch(x){err=x.message}render()});
document.addEventListener('change',async e=>{if(e.target.id!='f')return;const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(!j.shows)throw 0;
  for(const id in j.shows){const n=j.shows[id],o=D.shows[id];if(o)Object.assign(o.seen,n.seen);else D.shows[id]={name:n.name||'',poster:n.poster||null,seen:n.seen||{},kind:n.kind,added:n.added||Date.now(),dropped:n.dropped}}
  save('data',D);err='';await refreshAll(true)}catch(x){err='Fichier invalide'}render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll(false)});
navigator.storage?.persist?.();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();refreshAll(false);
</script></body></html>
