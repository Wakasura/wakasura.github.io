function vStats(){let ep=0,min=0,done=0,run=0,nw=0,dr=0,an=0,se=0;const mo={},ids=Object.keys(D.shows);
 ids.forEach(id=>{const s=D.shows[id];if(s.kind=='anime')an++;else se++;if(s.dropped)dr++;

 if(os==null){const f=eps.find(x=>x[3]&&x[3]<=T&&!s.seen[x[0]+'-'+x[1]]);os=f?f[0]:+Object.keys(by).pop()}
 let h=`<p><button data-back>Retour</button></p><div class="hd">${s.poster?`<img src="https://image.tmdb.org/t/p/w185${s.poster}" alt="">`:'<div class="ph"></div>'}<div class="t"><h2 style="margin-top:0">${esc(s.name)}</h2><span class="m">${s.kind=='anime'?'Anime':'Série'}${s.dropped?', abandonnée':''}</span><p class="m">${v} sur ${tot} épisodes vus (${p} %)</p>${bar(p)}</div></div>`+
  (s.overview?`<p>${esc(s.overview)}</p>`:'')+
  `<div class="ac2"><button data-drop="${id}">${s.dropped?'Reprendre le suivi':'Drop (abandonner)'}</button><button data-kind="${id}">Classer comme ${s.kind=='anime'?'série':'anime'}</button><button data-del="${id}">Ne plus suivre</button></div>${provHtml(id)}<h2>Saisons</h2>`;
 for(const n in by)h+=`<details${n==os?' open':''}><summary><b>Saison ${n}</b></summary><p><button data-all="${id}|${n}">Tout marquer comme vu</button></p>`+
  by[n].map(x=>{const k=x[0]+'-'+x[1],ok=x[3]&&x[3]<=T;return `<div class="ep${ok?'':' fut'}"><label class="lb"><input type="checkbox" data-ep="${id}|${x[0]}|${x[1]}"${s.seen[k]?' checked':''}><span class="t">${x[1]}. ${esc(x[2])}<br><span class="m">${x[3]?fd(x[3]):'Date inconnue'}</span></span></label>${ok?`<button data-upto="${id}|${x[0]}|${x[1]}">Vu jusqu'ici</button>`:''}</div>`}).join('')+'</details>';
 return h}
const rc=r=>`<div class="c">${img(r.poster_path)}<div class="t"><b>${esc(r.name)}</b><span class="m">${(r.first_air_date||'').slice(0,4)}</span></div>${D.shows[r.id]?'<span class="m">Suivie</span>':`<button class="p" data-add="${r.id}">Suivre</button>`}</div>`;
function vAdd(){let h=`<h2>Découvrir</h2><input type="search" id="q" placeholder="Rechercher une série ou un anime, puis Entrée" value="${esc(q)}">`;
 if(res.length)return h+'<div style="margin-top:12px">'+res.map(rc).join('')+'</div>';
 const t=rt,pl=RP[t],pg=pl?pl.slice(RO[t]||0,(RO[t]||0)+10):[],sh=new Set(pg.map(r=>r.id));
 h+=chips('rt',[['serie','Séries'],['anime','Animes']],rt);
 if(!K)return h;
 if(!pl)return h+'<p class="m">Chargement…</p>';
 h+='<h3>Recommandées d’après ce que tu suis</h3>'+(pg.length?pg.map(rc).join('')+'<p><button data-more>D’autres recommandations</button></p>':'<p class="m">Aucune recommandation pour le moment. Suis quelques '+(t=='anime'?'animes':'séries')+' pour en obtenir.</p>');
 const T2=(TRd[t]||[]).filter(r=>!sh.has(r.id));
 if(T2.length)h+='<h3>'+(t=='anime'?'Animes populaires':'Tendances de la semaine')+'</h3>'+T2.map(rc).join('');
 return h}
function vSet(){return `<h2>Thème</h2>${chips('th',[['auto','Auto'],['light','Clair'],['dark','Sombre']],TH)}<h2>Clé API TMDB</h2><p class="m">Crée un compte gratuit sur themoviedb.org, puis Paramètres, API. Colle ici la clé (v3) ou le jeton.</p><input id="key" value="${esc(K)}" placeholder="Clé API"><p><button class="p" data-savekey>Enregistrer</button></p>
<h2>Pays</h2><p class="m">Pour afficher où regarder les séries (code à 2 lettres, par exemple BE, FR ou CA).</p><p><input id="cty" maxlength="2" value="${esc(CT)}" style="width:90px;text-transform:uppercase"> <button data-savecty>OK</button></p><h2>Sauvegarde</h2><p class="m">Dernier export : ${esc(LS('lastexp')||'jamais')}</p><p><button data-exp>Exporter</button> <button data-imp>Importer</button></p><input type="file" id="f" accept=".json,application/json" hidden>
<h2>Données</h2><p><button data-refresh>Actualiser les dates de sortie</button></p>
<h2>À propos</h2><p class="m">Ce produit utilise l'API TMDB mais n'est ni approuvé ni certifié par <a href="https://www.themoviedb.org" style="color:var(--ac)">TMDB</a>. Données de disponibilité : JustWatch.</p>`}
const IC={stats:'<path d="M5 20V10M12 20V4M19 20v-7"/>',todo:'<path d="M8 5v14l11-7z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',list:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
function render(){const y=window.scrollY;
 const body=open?vDetail(open):!K&&tab!='set'?'<h2>Bienvenue</h2><p>Ajoute ta clé TMDB dans Réglages pour commencer.</p>':{todo:vTodo,cal:vCal,list:vList,add:vAdd,stats:vStats,set:vSet}[tab]();
 $('#app').innerHTML=(err?`<p class="er">${esc(err)}</p>`:'')+(busy?`<p class="m">${busy}</p>`:'')+(open||tab=='set'?'':bk())+body+'<p class="m" style="margin-top:28px;font-size:12px">Données et images fournies par TMDB.</p>';
 $('#nav').innerHTML=[['todo','À voir'],['cal','Sorties'],['list','Séries'],['stats','Stats'],['add','Explorer'],['set','Réglages']].map(([k,l])=>`<button data-tab="${k}" class="${tab==k&&!open?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg><span>${l}</span></button>`).join('');
 window.scrollTo(0,y)}
document.addEventListener('click',async ev=>{
 const t=ev.target.closest('[data-tab],[data-seen],[data-open],[data-back],[data-ep],[data-all],[data-upto],[data-f],[data-drop],[data-kind],[data-more],[data-th],[data-snooze],[data-savecty],[data-add],[data-del],[data-savekey],[data-exp],[data-imp],[data-refresh]');if(!t)return;const d=t.dataset;
 if('tab'in d){tab=d.tab;open=null;err='';if(tab=='add')loadDisc()}
 else if('seen'in d){ev.stopPropagation();const[i,s,e]=d.seen.split('|');D.shows[i].seen[s+'-'+e]=today();D.shows[i].last=Date.now();save('data',D)}
 else if('open'in d){open=d.open;os=null;window.scrollTo(0,0);loadProv(d.open)}
 else if('back'in d)open=null;
 else if('ep'in d){const[i,s,e]=d.ep.split('|');os=+s;if(t.checked){D.shows[i].seen[s+'-'+e]=today();D.shows[i].last=Date.now()}else delete D.shows[i].seen[s+'-'+e];save('data',D)}
 else if('all'in d){const[i,n]=d.all.split('|'),T=today();os=+n;C[i].eps.filter(x=>x[0]==n&&x[3]&&x[3]<=T).forEach(x=>D.shows[i].seen[n+'-'+x[1]]=1);D.shows[i].last=Date.now();save('data',D)}
 else if('upto'in d){const[i,a,b]=d.upto.split('|').map(Number),T=today();os=a;C[i].eps.forEach(x=>{if(x[3]&&x[3]<=T&&(x[0]<a||x[0]==a&&x[1]<=b))D.shows[i].seen[x[0]+'-'+x[1]]=1});D.shows[i].last=Date.now();save('data',D)}
 else if('f'in d){const[k,v]=d.f.split('|');if(k=='ty')ty=v;else if(k=='st')st=v;else if(k=='th')setTheme(v);else if(k=='rt'){rt=v;loadDisc()}else so=v}
 else if('drop'in d){const x=D.shows[d.drop];x.dropped=!x.dropped;save('data',D)}
 else if('kind'in d){const x=D.shows[d.kind];x.kind=x.kind=='anime'?'serie':'anime';save('data',D)}
 else if('more'in d)return moreRec();
 else if('th'in d){setTheme(isDark()?'light':'dark')}
 else if('snooze'in d){const x=new Date();x.setDate(x.getDate()+3);save('snooze',dstr(x))}
 else if('savecty'in d){CT=($('#cty').value.trim().toUpperCase()||CT).slice(0,2);save('country',CT)}
 else if('add'in d){const r=[...res,...(RP.serie||[]),...(RP.anime||[]),...(TRd.serie||[]),...(TRd.anime||[])].find(x=>x.id==d.add);if(!r)return;D.shows[d.add]={name:r.name,poster:r.poster_path,seen:{},added:Date.now()};save('data',D);busy='Chargement des épisodes…';render();
  try{await refresh(d.add,true)}catch(e){err=e.message}busy=''}
 else if('del'in d){if(!confirm('Ne plus suivre cette série ?'))return;delete D.shows[d.del];delete C[d.del];save('data',D);save('cache',C);open=null}
 else if('savekey'in d){K=$('#key').value.trim();save('key',K);tab='todo';render();return refreshAll(true)}
 else if('exp'in d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,shows:D.shows})],{type:'application/json'}));a.download='series-'+today()+'.json';a.click();save('lastexp',today())}
 else if('imp'in d)return $('#f').click();
 else if('refresh'in d)return refreshAll(true);
 render()});
document.addEventListener('keydown',async e=>{if(e.key!='Enter'||e.target.id!='q')return;q=e.target.value;err='';
 if(!K)err='Ajoute d’abord ta clé TMDB dans Réglages.';else if(!q.trim())res=[];else try{res=(await api('/search/tv',{query:q})).results.slice(0,15)}catch(x){err=x.message}render()});
document.addEventListener('change',async e=>{if(e.target.id!='f')return;const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(!j.shows)throw 0;
  for(const id in j.shows){const n=j.shows[id],o=D.shows[id];if(o){Object.assign(o.seen,n.seen);o.last=Math.max(o.last||0,n.last||0)}else D.shows[id]={name:n.name||'',poster:n.poster||null,seen:n.seen||{},kind:n.kind,added:n.added||Date.now(),dropped:n.dropped,last:n.last}}
  save('data',D);err='';await refreshAll(true)}catch(x){err='Fichier invalide'}render()});
document.addEventListener('input',e=>{if(e.target.id=='qs'){qs=e.target.value;$('#sl').innerHTML=listHtml()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll(false)});
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applyTheme);
navigator.storage?.persist?.();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();refreshAll(false);
</script></body></html>
