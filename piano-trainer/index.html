<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano Trainer — import MXL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/4.2.2/vexflow-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<div class="brand">
<h1><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#1b1d22"/><rect x="5" y="6" width="18" height="2.4" rx="1.2" fill="#b3243a"/><g fill="#f4f2ec"><rect x="5" y="10" width="5.2" height="12" rx="1"/><rect x="11.4" y="10" width="5.2" height="12" rx="1"/><rect x="17.8" y="10" width="5.2" height="12" rx="1"/></g><g fill="#1b1d22"><rect x="8.4" y="10" width="3.4" height="7" rx=".8"/><rect x="14.8" y="10" width="3.4" height="7" rx=".8"/></g></svg>Piano Trainer</h1>
<button id="menuBtn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Ouvrir les réglages">⚙ Réglages</button>
</div>
<nav class="page-nav" aria-label="Navigation principale">
  <button id="trainerTab" type="button" aria-current="page">Piano</button>
  <button id="theoryTab" type="button">Théorie piano</button>
  <button id="guitarTab" type="button">Guitare</button>
  <button id="gTheoryTab" type="button">Théorie guitare</button>
</nav>
</header>
<main id="trainerPage" class="page">
<div class="bar">
  <div id="modeSeg" class="seg" role="group" aria-label="Mode"><button type="button" data-mode="game">Jeu</button><button type="button" data-mode="partition">Partition</button><button type="button" data-mode="drill">Exercices</button></div>
  <span id="scoreBar" class="bar sub" hidden>
    <label class="btn">Importer .mxl<input id="file" type="file" multiple accept=".mxl,.musicxml,.xml" hidden></label>
    <select id="lib" hidden></select><select id="partSel" hidden title="Parties à jouer"></select><button id="del" hidden title="Supprimer cette partition">Supprimer</button>
  </span>
  <div class="stats"><span>Streak : <span id="st">0</span></span><span>Best : <span id="bt">0</span></span></div>
</div>
<div class="bar" id="gameBar">
  <div id="gameSeg" class="seg" role="group" aria-label="Type de jeu"><button type="button" data-game="note">Lecture</button><button type="button" data-game="chord">Accords</button></div>
  <span id="gameOpts" class="bar sub">
    <select id="chordKey" title="Tonalité" hidden><option value="any">Toutes les tonalités</option></select>
    <select id="chordDeg" title="Degrés proposés" hidden><option value="all">Tous les degrés (I à vii°)</option><option value="main">I – IV – V</option><option value="pop">I – IV – V – vi</option></select>
    <select id="chordShow" title="Affichage" hidden><option value="name">Afficher le nom</option><option value="deg">Afficher le degré</option></select>
    <select id="chordSet" title="Accords proposés" hidden><option value="mm">Majeurs et mineurs</option><option value="maj">Majeurs</option><option value="min">Mineurs</option><option value="all">Tous (dim., aug., 7)</option></select>
    <select id="chordInv" title="Renversement" hidden><option value="free">Renversement libre</option><option value="root">Position fondamentale</option><option value="1">1er renversement</option><option value="2">2ᵉ renversement</option><option value="rand">Renversement aléatoire</option></select>
    <select id="range"><option value="48,84">Facile C3–C6</option><option value="36,96">C2–C7</option><option value="21,108">Complet A0–C8</option></select>
    <select id="clef"><option value="both">Les 2 clés</option><option value="treble">Clé de sol</option><option value="bass">Clé de fa</option></select>
    <label><input type="checkbox" id="acc" checked> Altérations</label>
    <label><input type="checkbox" id="ear"> À l’oreille</label><button id="replay" hidden>Réécouter</button>
    <button id="chordHear" type="button" hidden>Écouter l’accord</button>
  </span>
</div>
<div class="bar" id="tools" hidden>
  <select id="hand"><option value="0">Les 2 mains</option><option value="1">Main droite</option><option value="2">Main gauche</option></select>
  <button id="prev">◀ Mesure</button><button id="next">Mesure ▶</button><button id="restart">⟲ Début</button>
  <button id="loop">Boucle</button><button id="listen">▶ Écouter</button>
  <button id="metro" aria-pressed="false">Métronome</button><button id="countBtn" aria-pressed="false" title="Décompte d’une mesure avant « Écouter »">Décompte</button><label>♩= <input type="number" id="bpm" value="80" min="30" max="240"></label>
</div>
<div class="bar" id="exoBar" hidden>
  <select id="exo"><option value="scale">Gammes</option><option value="five">5 doigts</option><option value="arp">Arpèges</option><option value="chords">Accords &amp; renversements</option><option value="cad">Cadences</option><option value="int">Intervalles</option><option value="key">Armures</option></select>
  <select id="variant"></select><label id="showStaffL" hidden><input type="checkbox" id="showStaff"> Afficher la portée</label><select id="tonic"></select><select id="reps" title="Répétitions"><option value="1">1×</option><option value="3">3×</option><option value="5" selected>5×</option><option value="10">10×</option><option value="0">∞ en boucle</option></select><button id="exoGo">Nouvel exercice</button>
</div>
<div id="info"></div><div id="fb" aria-live="polite"></div>
<div id="pageNav" class="bar sub" style="margin:0 0 8px;justify-content:center" hidden><select id="pgScore" title="Choisir la partition"></select><button id="pgPrev" type="button">◀ Page précédente</button><span id="pgInfo"></span><button id="pgNext" type="button">Page suivante ▶</button></div>
<div id="score"></div>
<div id="ansBar" class="answers" hidden><div id="ansBtns" class="ans-grid"></div><div class="ans-actions"><button id="ansReplay" hidden>Réécouter</button><button id="ansNext" class="btn" hidden>Suivant ▶</button></div></div>
<div id="kbWrap"><div id="kbNav" hidden><button id="kbLeft" type="button" aria-label="Clavier vers la gauche">◀</button><button id="kbRight" type="button" aria-label="Clavier vers la droite">▶</button></div><div id="kbScroll"><div id="kb"></div></div></div>
</main>

<main id="theoryPage" class="page" hidden>
  <div id="theoryIndex" aria-label="Sommaire des leçons"></div>
  <nav id="theoryLessonNav" class="theory-lesson-nav" aria-label="Navigation des leçons" hidden>
    <button id="theoryBack" type="button">← Toutes les rubriques</button>
    <div>
      <button id="theoryPrev" type="button">← Précédente</button>
      <button id="theoryNext" type="button">Suivante →</button>
    </div>
  </nav>
  <div class="theory">
  </div>
</main>

<main id="guitarPage" class="page" hidden>
<div class="bar">
  <div id="gModeSeg" class="seg" role="group" aria-label="Mode guitare"><button type="button" data-gm="game">Jeu</button><button type="button" data-gm="drill">Exercices</button><button type="button" data-gm="song">Morceaux</button><button type="button" data-gm="tuner">Accordeur</button></div>
  <button id="gMic" type="button" aria-pressed="false" title="Valider ce que tu joues avec le micro" hidden>🎤 Micro</button><span id="gHeard" hidden></span>
  <div class="stats"><span>Streak : <span id="gSt">0</span></span><span>Best : <span id="gBt">0</span></span></div>
</div>
<div class="bar" id="gGameBar">
  <div id="gGameSeg" class="seg" role="group" aria-label="Type de jeu"><button type="button" data-gg="find">Trouver</button><button type="button" data-gg="name">Nommer</button><button type="button" data-gg="chord">Accords</button><button type="button" data-gg="chordName">Diagrammes</button></div>
  <span class="bar sub">
    <select id="gFrets" title="Zone du manche"><option value="4">Cases 0–4</option><option value="7">Cases 0–7</option><option value="12">Cases 0–12</option></select>
    <select id="gChordSet" title="Accords proposés" hidden><option value="open">Accords ouverts</option><option value="sev">Ouverts + septièmes</option><option value="barre">Barrés (tous les noms)</option></select>
    <label><input type="checkbox" id="gAcc" checked> Altérations</label>
    <label><input type="checkbox" id="gLab"> Afficher les notes</label>
  </span>
</div>
<div class="bar" id="gExoBar" hidden>
  <select id="gxType" title="Exercice"></select><select id="gxVariant"></select><select id="gxTonic"></select>
  <select id="gxPos" hidden title="Position"><option value="0">Racine sur la corde de Mi grave</option><option value="1">Racine sur la corde de La</option></select>
  <label><input type="checkbox" id="gxHints" checked> Afficher les cibles</label>
  <button id="gxGo" type="button">Nouvel exercice</button><button id="gxListen" type="button">▶ Écouter</button>
  <label>♩= <input type="number" id="gxBpm" value="80" min="30" max="240"></label>
</div>
<div class="bar" id="gSongBar" hidden>
  <select id="gLib" title="Morceau"></select><select id="gTrack" hidden title="Piste"></select>
  <label class="btn">Importer<input id="gFile" type="file" multiple accept=".gp,.gp3,.gp4,.gp5,.gpx,.mxl,.musicxml,.xml" hidden></label>
  <button id="gDel" type="button" hidden>Supprimer</button>
</div>
<div class="bar" id="gSongTools" hidden>
  <button id="gPrevM" type="button">◀ Mesure</button><button id="gNextM" type="button">Mesure ▶</button><button id="gRestart" type="button">⟲ Début</button>
  <button id="gLoop" type="button">Boucle</button><button id="gSongListen" type="button">▶ Écouter</button><button id="gMetro" type="button" aria-pressed="false">Métronome</button>
  <label>♩= <input type="number" id="gSongBpm" value="80" min="30" max="240"></label>
  <label><input type="checkbox" id="gSongHints" checked> Afficher les cibles</label>
</div>
<div id="gInfo"></div><div id="gfb" aria-live="polite"></div>
<div id="gQuestion"></div>
<div id="gTuner" hidden>
  <div class="gt-row"><select id="gA4" title="Diapason (La4)"><option value="432">La = 432 Hz</option><option value="438">La = 438 Hz</option><option value="440" selected>La = 440 Hz</option><option value="442">La = 442 Hz</option><option value="444">La = 444 Hz</option></select><button id="gTunerMic" type="button">Activer le micro</button></div>
  <div class="gt-note"><span id="gTunerNote">–</span><sub id="gTunerOct"></sub></div>
  <svg class="gt-gauge" viewBox="0 0 300 165" role="img" aria-label="Aiguille de l’accordeur">
    <path d="M30 140 A120 120 0 0 1 270 140" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="10"/>
    <path d="M141 22 A120 120 0 0 1 159 22" fill="none" stroke="var(--ok)" stroke-width="14"/>
    <line id="gNeedle" class="gt-needle idle" x1="150" y1="140" x2="150" y2="34" stroke-width="4" stroke-linecap="round" transform="rotate(0 150 140)"/>
    <circle cx="150" cy="140" r="7" fill="currentColor"/>
    <text x="30" y="160" font-size="12" fill="currentColor" text-anchor="middle">♭</text><text x="270" y="160" font-size="12" fill="currentColor" text-anchor="middle">♯</text>
  </svg>
  <div id="gTunerCents"></div><div id="gTunerInfo">Micro éteint : appuie sur « Activer le micro ».</div>
  <div id="gTunerStrings" class="gt-row"><button type="button" data-s="auto" aria-pressed="true">Auto</button><button type="button" data-s="0">6ᵉ Mi</button><button type="button" data-s="1">5ᵉ La</button><button type="button" data-s="2">4ᵉ Ré</button><button type="button" data-s="3">3ᵉ Sol</button><button type="button" data-s="4">2ᵉ Si</button><button type="button" data-s="5">1ʳᵉ Mi</button></div>
  <p class="gt-help">Choisis une corde : un son de référence est joué, et l’accordeur compare ta corde à cette note. En « Auto », il reconnaît la note la plus proche.</p>
</div>
<div id="gTab" hidden></div>
<div id="gDiagram" hidden></div>
<div id="gBoardWrap" class="gboardwrap"><div id="gBoard"></div></div>
<div id="gAns" class="answers" hidden><div id="gAnsBtns" class="ans-grid"></div><div class="ans-actions"><button id="gNext" class="btn" hidden>Suivant ▶</button></div></div>
<div id="gChordActions" class="ans-actions" hidden><button id="gValidate" class="btn" type="button">Valider</button><button id="gClear" type="button">Effacer</button><button id="gShow" type="button">Montrer une forme</button><button id="gHear" type="button">Écouter l’accord</button></div>
</main>

<main id="gTheoryPage" class="page" hidden>
  <div id="gtIndex" class="theory-index" aria-label="Sommaire des leçons de guitare"></div>
  <nav id="gtNav" class="theory-lesson-nav" aria-label="Navigation des leçons de guitare" hidden>
    <button id="gtBack" type="button">← Toutes les rubriques</button>
    <div><button id="gtPrev" type="button">← Précédente</button><button id="gtNext" type="button">Suivante →</button></div>
  </nav>
  <div class="theory"></div>
</main>

<div id="drawerOv" class="drawer-overlay"></div>
<aside id="drawer" class="drawer" aria-label="Réglages" aria-hidden="true">
  <div class="drawer-head"><span>Réglages</span><button id="drawerClose" type="button" aria-label="Fermer">✕</button></div>
  <button id="labels" aria-pressed="false">Afficher notes</button>
  <button id="solf" aria-pressed="false">Do Ré Mi</button>
  <button id="corr" aria-pressed="false">Mode correction</button>
  <button id="midiBtn">Clavier MIDI</button>
  <button id="theme">Thème : automatique</button>
  <button id="resetStats">Réinitialiser les stats</button>
  <button id="gSoundBtn" type="button">Son guitare : corde pincée</button>
  <a class="btn" href="/">📺 Mes séries</a>
  <button id="full" aria-expanded="false">Mes partitions</button>
  <label><input type="checkbox" id="snd" checked> Son</label>
</aside>

<script src="js/theory-data.js"></script>
<script src="js/guitar-theory-data.js"></script>
<script src="js/core.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/theory-ui.js"></script>
<script src="js/exercises.js"></script>
<script src="js/guitar-audio.js"></script>
<script src="js/guitar-core.js"></script>
<script src="js/guitar-songs.js"></script>
<script src="js/guitar-tab.js"></script>
<script src="js/guitar.js"></script>
<script src="js/guitar-songs-ui.js"></script>
<script src="js/guitar-mic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
